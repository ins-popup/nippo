<!doctype html>
<meta charset="utf-8">
<title>WILD THINGS POPUP｜T8 日報・在庫管理</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e3e3e4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231d1f17%27/%3E%3Cpath d=%27M3 22 11 9l6 8 4-5 8 10z%27 fill=%27%23d8ff1a%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Barlow+Condensed:wght@500;600;700&family=Oswald:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 黒地＋オレンジのアクセント。上にタブ（スマホは下部固定）、下に作業エリア。入力は大きなタップ領域、確認は色と文言で状態を示す。 */
:root{
  --bg:#0b0b0b; --surface:#161311; --surface2:#1f1b18; --ink:#f1ece6; --muted:#a0978f;
  --line:#2c2723; --line2:#4d453f; --accent:#ff6030; --accent-ink:#160a05; --accent-soft:#3a1f14;
  --ok:#62d096; --ok-soft:#12301f; --warn:#e6ad3f; --warn-soft:#33260c; --bad:#ff7b72; --bad-soft:#3b1614;
  --font-ui:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  --font-num:"Barlow Condensed","Noto Sans JP","Arial Narrow",sans-serif;
  --font-head:"Oswald","Barlow Condensed","Noto Sans JP","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
#shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:0}
main{min-width:0;display:flex;flex-direction:column;gap:14px;padding-top:12px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);
  border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px))}
nav button{position:relative;border:0;background:none;padding:10px 4px 9px;min-height:56px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button .t{font-size:15px;font-weight:700}
nav button .s{font:500 10px var(--font-head);letter-spacing:.14em}
nav button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
nav .badge{position:absolute;top:6px;right:calc(50% - 30px);min-width:20px;height:20px;border-radius:10px;padding:0 5px;background:var(--warn);color:#1a1206;
  font:700 12px/20px var(--font-num);text-align:center}
nav .badge.red{background:var(--bad)}
@media (min-width:900px){
  body{padding-block:0 40px}
  #shell{grid-template-columns:1fr}
  nav{position:sticky;top:0;bottom:auto;grid-template-columns:repeat(6,minmax(96px,auto));justify-content:start;gap:2px;padding:0;background:var(--bg);border:0;border-bottom:1px solid var(--line);z-index:12}
  nav button{flex-direction:row;gap:8px;align-items:baseline;justify-content:center;padding:14px 18px;min-height:0}
  nav button[aria-current="page"]{background:none;box-shadow:inset 0 -3px 0 var(--accent)}
  nav .badge{position:static;margin-left:2px}
  .datebar{top:52px!important}
}
/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 2px}
.brand{display:flex;flex-direction:column;line-height:1.2;gap:2px}
.brand small{font:600 12px var(--font-head);letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
.brand b{font:700 26px/1.15 var(--font-head);letter-spacing:.04em;text-transform:uppercase}
.brand b span{font:700 15px var(--font-ui);margin-left:10px;letter-spacing:0;color:var(--ink);text-transform:none}
.brand i{font-style:normal;font-size:12px;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.who input{min-height:38px;width:150px;padding:4px 10px;font-size:15px}
.who input.need{border-color:var(--warn)}
.logrow{display:grid;grid-template-columns:104px 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:0}
.logrow .tm{font:500 13px var(--font-num);color:var(--muted);padding-top:2px}
.logrow .tx{min-width:0;overflow-wrap:anywhere;font-size:14px}
.logrow .by{font-weight:700;margin-right:6px}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:500;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.demo{background:var(--warn-soft);color:var(--warn)}
.banner.ro{background:var(--surface2);border:1px solid var(--line)}
.banner button{margin-left:auto}
/* cards / controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{margin:0 0 10px;font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 small{font-size:12.5px;font-weight:400;color:var(--muted)}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font:600 30px/1.15 var(--font-num);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;font-weight:500;margin-left:2px}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:10px;min-height:44px;padding:0 16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:34px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;min-width:0}
label.f .h{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line2);background:var(--surface);border-radius:10px;min-height:44px;padding:8px 12px;font-size:16px;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.55}
input:read-only,textarea:read-only{background:var(--surface2)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>*{min-width:0}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.seg button{border:1.5px solid var(--line2);background:var(--surface);border-radius:10px;min-height:46px;font-weight:700;cursor:pointer;padding:4px 8px;line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.ret button[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#1a1206}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line2);background:var(--surface);border-radius:10px;min-height:44px;min-width:56px;padding:2px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.chip b{font-size:16px}.chip i{font:500 12px/1 var(--font-num);font-style:normal;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] i{color:var(--accent-ink)}
.chip.zero{border-style:dashed;color:var(--muted)}
.chip.neg{border-color:var(--bad);color:var(--bad)}
/* datebar */
.datebar{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:8}
.datebar .d{flex:1;text-align:center;line-height:1.2;min-width:0}
.datebar .d b{font:600 26px/1.1 var(--font-num)}
.datebar .d span{display:block;font-size:12.5px;color:var(--muted)}
.datebar input[type=date]{width:46px;padding:0;min-height:44px;opacity:.01;position:absolute}
.datebar .pick{position:relative;width:44px;height:44px;display:grid;place-items:center;border:1.5px solid var(--line2);border-radius:10px;cursor:pointer;font-size:12px;font-weight:700}
.datebar .pick input{inset:0;width:100%;height:100%;cursor:pointer}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
/* picker */
.hinlist{max-height:238px;overflow:auto;border:1.5px solid var(--line2);border-radius:10px;background:var(--surface)}
.hin{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;min-height:46px;padding:6px 12px;cursor:pointer}
.hin:last-child{border-bottom:0}
.hin[aria-pressed="true"]{background:var(--accent-soft)}
.hin .c{font:500 13px var(--font-num);color:var(--muted);min-width:98px}
.hin .nm{flex:1;min-width:0;font-weight:500}
.hin .st{font:600 14px var(--font-num);color:var(--muted)}
.hin .st.neg{color:var(--bad)}
.colorrow{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;margin-top:8px}
.colorrow .cn{font-weight:700;font-size:13px;overflow-wrap:anywhere}
.stepper{display:flex;gap:8px;align-items:center}
.stepper button{width:52px;height:52px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);font-size:26px;font-weight:700;cursor:pointer;line-height:1}
.stepper input{width:84px;text-align:center;font:600 28px var(--font-num);min-height:52px}
.preview{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;min-height:44px}
.preview b{font-family:var(--font-num);font-size:18px}
.warnline{color:var(--bad);font-weight:700;font-size:13.5px}
.sel{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;border-left:4px solid var(--accent);padding:4px 10px;background:var(--accent-soft);border-radius:0 8px 8px 0}
/* lists / tables */
.entry{display:grid;grid-template-columns:48px auto 1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .tm{font:500 13px var(--font-num);color:var(--muted)}
.entry .nm{min-width:0;overflow-wrap:anywhere;font-size:14px}
.entry .q{font:600 20px var(--font-num)}
.kind{border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.kind.ret{background:var(--warn-soft);color:var(--warn)}
.kind.oth{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:8px 10px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted);white-space:normal;line-height:1.25;vertical-align:bottom;z-index:2}
th:not(:first-child){min-width:64px}
th:first-child,td:first-child{max-width:150px;white-space:normal;text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
th:first-child{background:var(--surface2);z-index:3}
tr.cur td{background:var(--accent-soft)}
tr.cur td:first-child{background:var(--accent-soft)}
tr.clickable{cursor:pointer}
tr.future td{color:var(--muted)}
tr.tot td{font-weight:700;background:var(--surface2)}
td.neg{color:var(--bad)}
.grp td{background:var(--surface2)!important;font-weight:700;text-align:left!important}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font:600 17px var(--font-num)}
.kv dd.big{font-size:22px}
.kv .hr{grid-column:1/-1;border-top:1px solid var(--line);margin:2px 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2);aspect-ratio:3/4;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.photo button{position:absolute;top:6px;right:6px}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:8px;align-items:center}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%}
.empty{border:2px dashed var(--line2);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.alert{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px}
.alert.red{border-color:var(--bad);background:var(--bad-soft)}
.alert.yel{border-color:transparent;background:var(--warn-soft)}
.alert .tag{font-weight:700;font-size:12px;border-radius:6px;padding:2px 8px;background:var(--bad);color:#1a0806;white-space:nowrap}
.alert.yel .tag{background:var(--warn);color:#1a1206}
.alert .tx{min-width:0;overflow-wrap:anywhere;font-size:14px}
.alert .tx small{display:block;color:var(--muted);font-size:12.5px}
.ok-all{border-radius:12px;background:var(--ok-soft);color:var(--ok);padding:18px;font-weight:700;text-align:center}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line2);background:var(--surface);border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;cursor:pointer;font-size:14px}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.rep{border-top:1px solid var(--line);padding:12px 0}
.rep:first-child{border-top:0}
.rep h3{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rep p{margin:2px 0;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.rep p b{color:var(--muted);font-weight:500;font-size:12.5px;display:block}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.25)}
#toast.err{background:var(--bad);color:#1a0806}
@media (min-width:900px){#toast{bottom:28px}}
.muted{color:var(--muted)}.right{text-align:right}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
.gate{max-width:440px;margin:12vh auto 0}
.seedinfo{font-size:13px;line-height:1.6;color:var(--muted)}.seedinfo.ok{color:#7fd48a}.seedinfo.bad{color:#ff8a70}
/* ===== THEME: MIST（霞んだグラデーション背景、すりガラスのカード、チャートリューズのライム、チャコールのパネル）===== */
:root{
  --bg:#e3e5e8; --surface:#f3f3f1; --surface2:#e8e8e6; --ink:#1b1c15; --muted:#6f7068;
  --line:rgba(27,28,21,.12); --line2:rgba(27,28,21,.22); --accent:#1d1f17; --accent-ink:#ffffff; --accent-soft:#e9f7a0;
  --ok:#3d7a1d; --ok-soft:#dcf3b4; --warn:#97680a; --warn-soft:#ffeaaa; --bad:#c2372b; --bad-soft:#ffd9d1;
  --lime:#d8ff1a; --char:#1d1f17;
  --font-brand:"Plus Jakarta Sans","Noto Sans JP",sans-serif;
  --glass:rgba(255,255,255,.55);
}
html{color-scheme:light}
body{font-family:"Plus Jakarta Sans","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;font-weight:500;font-size:16px;line-height:1.65;color:var(--ink);
  background:
   radial-gradient(ellipse 520px 380px at -10% 8%,rgba(216,255,26,.20),transparent 70%),
   linear-gradient(180deg,#d6dfe5 0%,#e3e3e4 48%,#ecdccf 100%);
  background-attachment:fixed;background-color:var(--bg)}
body::before{background:transparent}
html::after{display:none}
body:has(.gate){background:linear-gradient(180deg,#d6dfe5 0%,#e3e3e4 48%,#ecdccf 100%) fixed;min-height:100vh}
html:has(.gate){background:#e3e3e4}
input[type=password]{background:rgba(255,255,255,.85)!important;border:1px solid rgba(27,28,21,.14)!important}
/* header：大きな文字に、斜体を混ぜる */
.top{padding:24px 0 10px;gap:12px}
.brand{gap:6px}
.brand small{font:700 12px "Plus Jakarta Sans",sans-serif;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.brand small::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 2px var(--char);margin-right:9px;vertical-align:0}
.brand b{font:800 36px/1.05 var(--font-brand);letter-spacing:-.035em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;color:var(--ink);text-transform:uppercase}
.brand b em{font:italic 500 .62em var(--font-brand);letter-spacing:-.01em;text-transform:lowercase;color:var(--ink)}
.brand .jp{font-size:17px;font-weight:700;margin-top:4px;letter-spacing:.02em}
.brand i{font-size:13.5px;color:var(--muted);font-style:normal}
.who{font-size:14px;color:var(--muted)}
.who input{min-height:46px;width:160px}
/* nav：すりガラスの浮かぶピルバー */
nav{left:50%;right:auto;transform:translateX(-50%);width:min(520px,calc(100% - 20px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  border:1px solid rgba(255,255,255,.8);border-radius:36px;padding:7px;gap:2px;background:rgba(255,255,255,.62);backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:0 16px 44px rgba(40,44,60,.2)}
nav button{min-height:56px;padding:8px 2px 6px;border-radius:28px;color:var(--muted);border:0;transition:background .15s}
nav button .t{font-size:15px;font-weight:700}
nav button .s{font:700 9px "Plus Jakarta Sans",sans-serif;letter-spacing:.14em;opacity:.8}
nav button[aria-current="page"]{background:var(--char);color:#fff;box-shadow:0 8px 20px rgba(29,31,23,.3)}
nav button[aria-current="page"] .s{color:var(--lime);opacity:1}
nav .badge{right:calc(50% - 24px);background:var(--lime)!important;color:var(--char)!important}
@media (min-width:900px){

    display:inline-grid;grid-template-columns:repeat(6,minmax(96px,auto));padding:5px;border-radius:999px;box-shadow:0 10px 30px rgba(40,44,60,.14);z-index:12}

<script>
(function(){
"use strict";
/* ============ 定数 ============ */
var KINDS=[
 {k:"sale",n:"販売",s:-1,net:1,hold:0,t:"sale"},
 {k:"ret_ok",n:"返品（再販可）",s:1,net:-1,hold:0,t:"ret"},
 {k:"ret_ng",n:"返品（再販不可）",s:0,net:-1,hold:1,t:"ret"},
 {k:"add",n:"追加投入（補充）",s:1,net:0,hold:0,t:"oth"},
 {k:"in",n:"店舗間移動（受入）",s:1,net:0,hold:0,t:"oth"},
 {k:"back",n:"返送・引き上げ",s:-1,net:0,hold:0,t:"oth"},
 {k:"out",n:"店舗間移動（送出）",s:-1,net:0,hold:0,t:"oth"},
 {k:"dmg_hold",n:"破損・不良（別保管）",s:-1,net:0,hold:1,t:"oth"},
 {k:"dmg_trash",n:"破損・不良（廃棄）",s:-1,net:0,hold:0,t:"oth"}
];
var KMAP={};KINDS.forEach(function(k){KMAP[k.k]=k});
var OTHER_KINDS=KINDS.filter(function(k){return k.t==="oth"});
var DEFAULT_CFG={start:"2026-10-28",end:"2026-11-17",budget:2100000,tax:0.1};
var WD=["日","月","火","水","木","金","土"];
var WEATHER=["晴れ","曇り","雨","雪"];

/* ============ 状態 ============ */
var S={
  tab:"entry", date:null, cfg:DEFAULT_CFG, skus:[], tx:[], days:{}, counts:{}, photos:[],
  loaded:{}, db:null, assets:null, user:null, dl:null, canWrite:null,
  demo:false, dTx:[], dDays:{}, dCounts:{}, dSkus:null,
  form:{hin:null,sku:null,kind:"sale",other:"add",qty:1,amount:"",memo:"",detail:false},
  q:"", confirmDel:null, stockFilter:"all",log:[],dLog:[],logFilter:"all", draft:{}, busy:false, sel:null, pending:false
};
function photoUrl(id){return window.T8Data?T8Data.photoUrl(id):''}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function yen(n){if(n==null||isNaN(n))return"—";var s=Math.abs(Math.round(n)).toLocaleString("ja-JP");return(n<0?"−":"")+"¥"+s}
function numf(n){return n==null?"—":Math.round(n).toLocaleString("ja-JP")}
function pct(x){return x==null||!isFinite(x)?"—":(Math.round(x*1000)/10).toFixed(1)+"%"}
function pd(s){var a=s.split("-");return Date.UTC(+a[0],+a[1]-1,+a[2])}
function fd(ms){var d=new Date(ms);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
function addDays(s,n){return fd(pd(s)+n*86400000)}
function md(s){var a=s.split("-");return(+a[1])+"/"+(+a[2])}
function wd(s){return WD[new Date(pd(s)).getUTCDay()]}
function mdw(s){return md(s)+"（"+wd(s)+"）"}
function todayStr(){if(S.demo)return"2026-11-03";var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function rangeDays(){var out=[],a=S.cfg.start,b=S.cfg.end;if(!a||!b)return out;for(var d=a,i=0;pd(d)<=pd(b)&&i<366;d=addDays(d,1),i++)out.push(d);return out}
function toast(msg,err){var t=$("toast");t.textContent=msg;t.className=err?"err":"";t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},err?4200:2200)}
function getSkus(){return S.demo&&S.dSkus?S.dSkus:S.skus}
function getTx(){return S.demo?S.dTx:S.tx}
function getDays(){return S.demo?S.dDays:S.days}
function getCounts(){return S.demo?S.dCounts:S.counts}
function skuLabel(s){return s?s.hin+"｜"+s.color+"｜"+s.size:"（削除された商品）"}
function unitIncl(p){return Math.round((p||0)*(1+S.cfg.tax))}
function writable(){return S.demo||S.canWrite!==false}

/* ============ 集計 ============ */
var memo=null;
function calc(){
  if(memo&&memo.key===S._ver)return memo.v;
  var skus=getSkus(),sm={};skus.forEach(function(s){sm[s.id]=s});
  var tx=getTx(),days={},st={};
  skus.forEach(function(s){st[s.id]={base:s.qty||0,sold:0,retOk:0,retNg:0,moves:0,hold:0,stock:s.qty||0,net:0}});
  var t=S.cfg.tax;
  function D(d){return days[d]||(days[d]={date:d,gross:0,actual:0,refund:0,retail:0,pcsSale:0,pcsRet:0,skus:{},sold:{},moves:[],lines:0,saleLines:0,off:false})}
  tx.forEach(function(r){
    var k=KMAP[r.kind],s=sm[r.skuId];if(!k||!s)return;
    var q=+r.qty||0,x=st[s.id],d=D(r.date);d.lines++;
    x.stock+=k.s*q;x.net+=k.net*q;x.hold+=k.hold*q;
    if(k.k==="sale"){x.sold+=q}else if(k.k==="ret_ok"){x.retOk+=q}else if(k.k==="ret_ng"){x.retNg+=q}else{x.moves+=k.s*q}
    if(k.t==="sale"){
      var g=unitIncl(s.sale)*q;d.gross+=g;d.actual+=(r.amount!=null&&r.amount!==""?+r.amount:g);d.retail+=unitIncl(s.retail)*q;d.pcsSale+=q;d.skus[s.id]=(d.skus[s.id]||0)+q;d.sold[s.id]=(d.sold[s.id]||0)+q;d.saleLines++;
    }else if(k.t==="ret"){
      var rf=unitIncl(s.sale)*q;d.refund+=(r.amount!=null&&r.amount!==""?+r.amount:rf);d.retail-=unitIncl(s.retail)*q;d.pcsRet+=q;d.skus[s.id]=(d.skus[s.id]||0)-q;
    }else{d.moves.push({sku:s,k:k,q:q})}
  });
  var rng=rangeDays(),n=rng.length||1,dayB=S.cfg.budget/n,cum=0,rows=[],all={};
  Object.keys(days).forEach(function(d){all[d]=1});rng.forEach(function(d){all[d]=1});
  var ordered=Object.keys(all).sort(),inRange={};rng.forEach(function(d){inRange[d]=1});
  var idx=0;
  ordered.forEach(function(ds){
    var d=days[ds]||{date:ds,gross:0,actual:0,refund:0,retail:0,pcsSale:0,pcsRet:0,skus:{},sold:{},moves:[],lines:0};
    var tot=Math.round(d.gross/(1+t)),ret=-Math.round(d.refund/(1+t)),dis=-Math.round((d.gross-d.actual)/(1+t));
    d.total=tot;d.ret=ret;d.dis=dis;d.net=tot+ret+dis;d.tax=Math.round(d.net*t);d.sum=d.net+d.tax;
    d.pcsNet=d.pcsSale-d.pcsRet;d.skuCnt=Object.keys(d.skus).filter(function(k){return d.skus[k]>0}).length;
    d.inRange=!!inRange[ds];
    if(d.inRange){idx++;cum+=d.net;d.cum=cum;d.ratio=dayB?d.net/dayB:null;d.cumRatio=dayB?cum/(dayB*idx):null;d.idx=idx}
    var dd=getDays()[ds]||{};d.cust=dd.customers!=null&&dd.customers!==""?+dd.customers:null;
    d.unit=d.cust?d.sum/d.cust:null;d.rep=dd.reportTotal!=null&&dd.reportTotal!==""?+dd.reportTotal:null;
    d.diff=d.rep!=null?d.sum-d.rep:null;
    d.actualNet=d.actual-d.refund;
    rows.push(d);days[ds]=d;
  });
  var v={days:days,rows:rows,st:st,sm:sm,dayB:dayB,n:n};
  memo={key:S._ver,v:v};return v;
}
function stockAsOf(id,date){
  var s=calc().sm[id];if(!s)return 0;var v=s.qty||0;
  getTx().forEach(function(r){if(r.skuId===id&&r.date<=date){var k=KMAP[r.kind];if(k)v+=k.s*(+r.qty||0)}});return v;
}
function dayPhotos(d){return S.photos.filter(function(p){return p.date===d}).sort(function(a,b){return(a.at||0)-(b.at||0)})}

/* ============ 確認項目 ============ */
function checks(){
  var C=calc(),out=[],today=todayStr(),sm=C.sm;
  Object.keys(C.st).forEach(function(id){var x=C.st[id];if(x.stock<0)out.push({lv:"red",tag:"在庫マイナス",txt:skuLabel(sm[id])+" の理論在庫が "+x.stock+" 点",sub:"入力ミス（数量・SKU違い）か、補充・返品の入力漏れの可能性があります",go:{tab:"stock",q:sm[id].hin}})});
  var cn=getCounts();
  Object.keys(cn).forEach(function(id){var c=cn[id];if(!sm[id]||c.n==null)return;var th=stockAsOf(id,c.date),df=c.n-th;if(df!==0)out.push({lv:"red",tag:"カウントのズレ",txt:skuLabel(sm[id])+"：実数 "+c.n+" ／ 理論 "+th+"（"+(df>0?"+":"")+df+"）",sub:md(c.date)+" 時点のカウントです",go:{tab:"stock",q:sm[id].hin}})});
  C.rows.forEach(function(d){
    if(!d.inRange){if(d.lines)out.push({lv:"red",tag:"会期外の日付",txt:mdw(d.date)+" に "+d.lines+" 件の入力があります",sub:"日付の入力ミスかもしれません。入力画面で確認してください",go:{tab:"entry",date:d.date}});return}
    var past=d.date<=today,had=d.lines>0;
    if(d.diff!=null&&d.diff!==0)out.push({lv:"red",tag:"レジ報告と不一致",txt:mdw(d.date)+"：入力から計算した合計 "+yen(d.sum)+" ／ レポート "+yen(d.rep)+"（差 "+(d.diff>0?"+":"")+yen(d.diff).replace("¥","¥")+"）",sub:"入力漏れ・数量違い・値引きの入力を確認してください",go:{tab:"sales",date:d.date}});
    if(past&&(had||d.date<today)){
      if(!had&&d.date<today)out.push({lv:"yel",tag:"売上の入力なし",txt:mdw(d.date)+" は売上の入力が0件です",sub:"売上ゼロの日なら問題ありません",go:{tab:"entry",date:d.date}});
      if(had){
        if(d.cust==null)out.push({lv:"yel",tag:"客数が未入力",txt:mdw(d.date),sub:"売上明細の日別パネルで入力します",go:{tab:"sales",date:d.date}});

async function addTx(rec){
  if(S.demo){rec.id="d"+Date.now()+Math.random().toString(36).slice(2,6);S.dTx.push(rec);bump();return true}

async function delTx(id){

}
async function putDay(date,patch){

async function putCount(id,date,n){

function holdRender(){S.hold=Date.now()+400;setTimeout(function(){if(S.pending){var a=document.activeElement;if(!(a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&/^(text|number|search)$/.test(a.type)))))render()}},460)}
function render(){
  var a=document.activeElement;
  if(!render.force&&S.hold&&Date.now()<S.hold){S.pending=true;return}
  if(a&&a!==document.body&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&/^(text|number|search)$/.test(a.type)))&&$("main").contains(a)&&!render.force){S.pending=true;return}
  var sf=$("seedfile"),ab=$("adminbox"),eb=$("eventbox");
  if(!render.force&&((sf&&((sf.files&&sf.files.length)||($("admin")&&$("admin").value)||(ab&&ab.open)))||(eb&&eb.open))){S.pending=true;return}
  render.force=false;S.pending=false;
  if(S.gate){$("nav").innerHTML="";$("main").innerHTML=gateHtml();return}
  var fid=a&&a.id,ss=a&&a.selectionStart,se=a&&a.selectionEnd,sy=window.scrollY;
  var allLoaded=S.demo||(S.loaded.skus&&S.loaded.tx&&S.loaded.days&&S.loaded.cfg);
  var html=header();
  if(!allLoaded&&!S.demo)html+='<div class="empty"><b>読み込み中です</b>保存されたデータを取得しています。</div>';
  else if(!getSkus().length)html+=emptySku();
  else html+=({entry:vEntry,sales:vSales,report:vReport,stock:vStock,check:vCheck,log:vLog})[S.tab]();
  $("main").innerHTML=html;
  renderNav();
  if(fid){var el=$(fid);if(el){el.focus();try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
  window.scrollTo(0,sy);
}

 {k:"sku",n:"SKU",syn:["sku","skuコード","skuid","商品sku","品番カラーサイズ"]},
 {k:"hin",n:"品番",syn:["品番","品番コード","商品コード","スタイル","スタイルno","スタイルコード","style","styleno","型番","品番no"]},
 {k:"name",n:"商品名",syn:["商品名","品名","名称","商品名称","アイテム名","name","商品"]},
 {k:"color",n:"カラー",syn:["カラー","カラー名","色","color","colour"]},

function seedNorm(s){return String(s==null?"":s).replace(/[（(][^）)]*[）)]/g,"").replace(/[\s　｜|※*＊]/g,"").toLowerCase()}
function seedMapHeader(row){
  var map={},used={},hdr=row.map(seedNorm);
  SEED_FIELDS.forEach(function(f){
    for(var i=0;i<hdr.length;i++){if(!used[i]&&hdr[i]&&f.syn.indexOf(hdr[i])>=0){map[f.k]=i;used[i]=1;break}}
  });
  SEED_FIELDS.forEach(function(f){
    if(map[f.k]!=null)return;
    for(var i=0;i<hdr.length;i++){
      if(used[i]||!hdr[i])continue;
      if(f.syn.some(function(w){return w.length>=2&&hdr[i].indexOf(w)>=0})){map[f.k]=i;used[i]=1;break}
    }
  });
  return map;
}
function seedFindHeader(rows){
  var best=null;
  for(var r=0;r<Math.min(rows.length,30);r++){
    var m=seedMapHeader(rows[r]||[]),c=Object.keys(m).length;
    if((m.hin!=null||m.sku!=null)&&c>=3&&(!best||c>best.c))best={r:r,m:m,c:c};
    if(seedJuchu(rows[r]||[],m)){best={r:r,m:m,c:99};break}
  }
  return best;
}
/* 基幹システムの「受注明細問合せ」をそのまま読み込む（商品＝品番、カラー略称・サイズ略称、備考の「30％OFF」から販売価格を計算） */
function seedJuchu(row,m){
  var H=row.map(function(x){return String(x==null?"":x).replace(/[\s　]/g,"")});
  function ix(n){return H.indexOf(n)}
  if(ix("商品")<0||ix("商品名1")<0||ix("カラー略称")<0||ix("サイズ略称")<0)return false;
  Object.keys(m).forEach(function(k){delete m[k]});
  m.hin=ix("商品");m.name=ix("商品名1");m.color=ix("カラー略称");m.size=ix("サイズ略称");
  if(ix("JAN1コード")>=0)m.jan=ix("JAN1コード");
  m.retail=ix("上代単価")>=0?ix("上代単価"):ix("受注単価");
  m.qty=ix("受注数")>=0?ix("受注数"):ix("受注残数量");
  if(ix("明細備考1")>=0)m.note=ix("明細備考1");
  m.juchu=1;
  return true;
}
function seedNum(v){
  if(v==null||v==="")return null;
  if(typeof v==="number")return isFinite(v)?v:null;
  var s=String(v).replace(/[,，¥￥円\s]/g,"").replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)});
  if(s===""||isNaN(Number(s)))return null;return Number(s);
}
function seedText(v){
  if(v==null)return"";
  if(typeof v==="number")return Number.isInteger(v)?String(v):String(v);
  return String(v).replace(/　/g," ").trim();
}
function seedRowsToPayload(rows){
  var h=seedFindHeader(rows);
  if(!h){var cand=rows.slice(0,30).map(function(r){return(r||[]).map(function(x){return String(x==null?"":x).trim()}).filter(Boolean)}).sort(function(a,b){return b.length-a.length})[0]||[];return{error:"見出しの行が見つかりません。1行目に「品番」「商品名」「カラー」「サイズ」「JAN」「上代」「投入数」「販売価格」などの見出しを入れてください。"+(cand.length?"（読み取れた見出し："+cand.slice(0,14).join("、")+(cand.length>14?"…":"")+"）":"（ファイルの中身が空のようです）")}};
  var m=h.m,miss=[];
  if(m.hin==null&&m.sku==null)miss.push("品番");
  if(m.qty==null)miss.push("投入数");
  if(m.sale==null&&m.retail==null)miss.push("販売価格（または上代）");
  if(miss.length)return{error:"次の見出しが見つかりません：" + miss.join("、")};
  var out=[],seen={},warn=[],dup=0,sci=0,noPrice=0,row=[],offN=0,noOff=0,merged=0;
  function g(k){return m[k]==null?"":row[m[k]]}
  for(var r=h.r+1;r<rows.length;r++){
    row=rows[r]||[];
    var sku=seedText(g("sku")),hin=seedText(g("hin")),color=seedText(g("color")),size=seedText(g("size")),name=seedText(g("name")),jan=seedText(g("jan"));
    if(!sku&&!hin)continue;
    if(sku&&!hin||sku&&(!color&&!size)){var pr=sku.split(/[｜|]/);if(pr.length>=3){if(!hin)hin=pr[0].trim();if(!color)color=pr[1].trim();if(!size)size=pr.slice(2).join("｜").trim()}else if(!hin)hin=sku}
    if(!sku)sku=hin+"｜"+color+"｜"+size;
    if(seen[sku]){if(m.juchu){var q2=seedNum(g("qty"));if(q2!=null)out[seen[sku]-1].qty+=q2;merged++;continue}dup++;continue}seen[sku]=out.length+1;
    if(/e\+/i.test(jan)){sci++;jan=""}
    var retail=seedNum(g("retail")),sale=seedNum(g("sale")),qty=seedNum(g("qty"));

      var om=String(m.note!=null?row[m.note]||"":"").replace(/[０-９．]/g,function(c){return c==="．"?".":String.fromCharCode(c.charCodeAt(0)-65248)}).match(/(\d+(?:\.\d+)?)\s*[％%]\s*OFF/i);
      if(om&&retail!=null){sale=Math.round(retail*(100-parseFloat(om[1]))/100);offN++}else if(retail!=null&&SEED_OFF!=null){sale=Math.round(retail*(100-SEED_OFF)/100);offN++}else if(retail!=null){sale=retail;noOff++}
    }
    if(retail==null&&sale==null)noPrice++;
    if(retail==null)retail=sale||0;if(sale==null)sale=retail||0;
    out.push({sku:sku,hin:hin,name:name,color:color,size:size,jan:jan,retail:retail,qty:qty==null?0:qty,sale:sale});
  }
  if(!out.length)return{error:"商品の行が見つかりませんでした。"};
  out.forEach(function(s,i){s.id="s"+String(i+1).padStart(3,"0")});
  if(m.juchu)warn.push("受注明細として読み込みました。販売価格は備考の「○○％OFF」から計算しています（"+offN+" 行）"+(noOff?"。オフ率が分からない "+noOff+" 行は上代と同じ価格にしています（上の「オフ率」欄に入れると全商品に使います）":"")+(merged?"。同じ商品の行 "+merged+" 件は数量を合算しました":""));
  if(dup)warn.push("同じSKUの行 "+dup+" 件は、1件目だけを使いました");
  if(sci)warn.push("JANが「4.58E+12」のような表示になっている行が "+sci+" 件あります（JANは空欄にしました。Excelの列を『文字列』にして入力し直してください）");
  if(noPrice)warn.push("価格が空の行が "+noPrice+" 件あります（0円になります）");
  return{skus:out,warn:warn};
}
function seedParseCsv(text){
  text=text.replace(/^﻿/,"");
  var first=text.split(/\r?\n/)[0]||"",d=(first.split("\t").length>first.split(",").length)?"\t":",";
  var rows=[],row=[],cell="",q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function seedDecode(buf){

  catch(e){try{return new TextDecoder("shift_jis").decode(buf)}catch(x){return new TextDecoder("utf-8").decode(buf)}}
}

async function seedReadFile(f){
  var nm=(f.name||"").toLowerCase();
  if(/\.json$/.test(nm)||f.type==="application/json"){
    var p=JSON.parse(await f.text());

  }
  var rows,offv=$("seedoff")&&$("seedoff").value!==""?parseFloat($("seedoff").value):NaN;
  SEED_OFF=isFinite(offv)&&offv>=0&&offv<=100?offv:null;
  if(/\.(xlsx|xlsm|xls)$/.test(nm)){
    try{await seedLoadXlsx()}catch(e){return{error:"Excelを読み込む部品を取得できませんでした。通信を確認するか、Excelを「CSV UTF-8」で保存して、もう一度お試しください。"}}
    var wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),best=null;
    wb.SheetNames.forEach(function(n){
      var r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}),h=seedFindHeader(r);

  var r=seedRowsToPayload(rows);
  if(r.error)return r;
  return{payload:{skus:r.skus},count:r.skus.length,warn:r.warn,sample:r.skus[0]};
}
