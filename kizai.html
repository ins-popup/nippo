<!doctype html>
<meta charset="utf-8">
<title>保管備品の管理｜POPUP</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e3e3e4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231d1f17%27/%3E%3Crect x=%277%27 y=%2711%27 width=%2718%27 height=%2713%27 rx=%272%27 fill=%27%23d8ff1a%27/%3E%3Crect x=%2711%27 y=%277%27 width=%2710%27 height=%275%27 rx=%271.5%27 fill=%27none%27 stroke=%27%23d8ff1a%27 stroke-width=%272%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 保管備品の管理：レジ・ドロアー・什器など「保管が必要な備品」を、どこに何台あるかで管理する。日報サイトと同じ合言葉・同じ保存先。 */
:root{
  --bg:#e3e5e8; --surface:#f3f3f1; --surface2:#e8e8e6; --ink:#1b1c15; --muted:#6f7068;
  --line:rgba(27,28,21,.12); --line2:rgba(27,28,21,.22); --accent:#1d1f17; --accent-ink:#ffffff; --accent-soft:#e9f7a0;
  --ok:#3d7a1d; --ok-soft:#dcf3b4; --warn:#97680a; --warn-soft:#ffeaaa; --bad:#c2372b; --bad-soft:#ffd9d1; --lime:#d8ff1a;
}
*{box-sizing:border-box}
html{color-scheme:light;background:#e3e3e4}
body{margin:0;font-family:"Plus Jakarta Sans","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;font-weight:500;font-size:16px;line-height:1.65;color:var(--ink);min-height:100vh;
  background:radial-gradient(ellipse 520px 380px at -10% 8%,rgba(216,255,26,.20),transparent 70%),linear-gradient(180deg,#d6dfe5 0%,#e3e3e4 48%,#ecdccf 100%);background-attachment:fixed}
main{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.brand small{display:block;font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.brand b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.brand span{font-size:13px;color:var(--muted)}
.card{background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);border-radius:22px;padding:18px;margin:0 0 14px;box-shadow:0 10px 30px rgba(27,28,21,.06)}
h2{font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--lime);border:2px solid var(--ink)}
h2 small{font-size:12.5px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.btn{font:inherit;font-size:14.5px;font-weight:700;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:999px;padding:9px 18px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:36px;padding:6px 14px;font-size:13px}
.btn.danger{color:var(--bad);border-color:rgba(194,55,43,.4)}
.btn:disabled{opacity:.5;cursor:default}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.f span{color:var(--ink)}
input,select,textarea{font:inherit;font-size:16px;font-weight:500;border:1px solid var(--line2);border-radius:14px;padding:10px 12px;min-height:46px;background:#fff;color:var(--ink);width:100%}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--surface2)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--surface2);font-size:12px;color:var(--muted);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);white-space:normal;min-width:140px;border-right:1px solid var(--line)}
th:first-child{background:var(--surface2)}
td.z{color:rgba(27,28,21,.25)}
td .code{display:block;font-size:11.5px;color:var(--muted)}
.loc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.lc{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface)}
.lc h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.lc .it{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0;border-top:1px dashed var(--line)}
.lc.alert{border-color:rgba(194,55,43,.35)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line2);background:rgba(255,255,255,.6);border-radius:999px;padding:8px 16px;min-height:42px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.hist .h{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.hist .h .t{min-width:0}
.hist .h small{display:block;color:var(--muted);font-size:12px}
.note{background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.7;margin:10px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:var(--lime);font-weight:700;font-size:14px;border-radius:999px;padding:10px 20px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.err{background:var(--bad);color:#fff}
.gate{max-width:440px;margin:12vh auto 0}
a{color:inherit}
@media (max-width:640px){.brand b{font-size:24px}main{padding:16px 16px 80px}}
</style>
<main id="main"><div class="card">読み込み中です…</div></main>
<div id="toast" hidden></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
(function(){
"use strict";
var S={gate:"login",err:"",tab:"loc",q:"",mv:{},it:{},eq:{},confirm:null,who:""};
var CATS=["レジ・決済機器","什器・ディスプレイ","工具・その他"];
var FIXED=["本部倉庫"],OUT="（廃棄・処分）",NEW="（新しく入れる）";
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function md(s){var a=String(s||"").split("-");return a.length===3?(+a[1])+"/"+(+a[2]):s}
function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var tt;function toast(m,err){var t=$("toast");t.textContent=m;t.className=err?"err":"";t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3200)}
try{S.who=localStorage.getItem("t8who")||""}catch(e){}
/* データ：eq コレクション。全店舗共通なので、IDは「global~」で始める（イベントの接頭辞を付けない） */
function docs(){var A=window.T8Data,o={};(A.rawAll("eq")||[]).forEach(function(r){if(r.id.indexOf("global~")===0)o[r.id.slice(7)]=r.data});return o}
function items(){var o=docs();return Object.keys(o).filter(function(k){return k.indexOf("i-")===0}).map(function(k){return Object.assign({id:k},o[k])}).sort(function(a,b){return(CATS.indexOf(a.cat)-CATS.indexOf(b.cat))||String(a.name).localeCompare(String(b.name),"ja")})}
function moves(){var o=docs();return Object.keys(o).filter(function(k){return k.indexOf("m-")===0}).map(function(k){return Object.assign({id:k},o[k])}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.at||0)-(b.at||0)})}
function put(id,data){return window.T8Data.rawSet("eq","global~"+id,data)}
/* 置き場所の候補：本部倉庫＋イベント名＋これまでに使った場所 */
function places(){
  var A=window.T8Data,set={},out=[];FIXED.forEach(function(p){set[p]=1;out.push(p)});
  (A.events()||[]).forEach(function(e){var n=e.name||e.id;if(n&&!set[n]){set[n]=1;out.push(n)}});
  moves().forEach(function(m){[m.from,m.to].forEach(function(p){if(p&&!set[p]){set[p]=1;out.push(p)}})});
  ["修理中","紛失"].forEach(function(p){if(!set[p]){set[p]=1;out.push(p)}});
  return out;
}
/* 置き場所ごとの数＝その場所へ入った数 − 出た数 */
function stock(){var st={};moves().forEach(function(m){var n=+m.n||0;if(m.from){(st[m.item]=st[m.item]||{})[m.from]=((st[m.item]||{})[m.from]||0)-n}if(m.to){(st[m.item]=st[m.item]||{})[m.to]=((st[m.item]||{})[m.to]||0)+n}});return st}
function total(st,id){var o=st[id]||{},t=0;Object.keys(o).forEach(function(k){t+=o[k]});return t}

function render(){
  var a=document.activeElement,fid=a&&a.id,sy=window.scrollY;
  if(S.gate){$("main").innerHTML=gateHtml();return}
  if(a&&fid&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!render.force){S.pending=true;return}
  render.force=false;S.pending=false;
  var h='<div class="top"><div class="brand"><small>POPUP ｜ EQUIPMENT</small><b>保管備品の管理</b><span>レジ・ドロアー・什器など、どこに何があるか</span></div><div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:8px"><span style="white-space:nowrap">入力者</span><input type="text" id="who" value="'+esc(S.who)+'" placeholder="あなたの名前" style="max-width:180px"></label><a class="btn small" href="./" style="text-decoration:none;display:inline-flex;align-items:center">日報サイトへ</a></div></div>';
  h+='<div class="tabs">'+[["loc","置き場所ごと"],["item","品目ごと"],["move","移動・登録"],["hist","記録"]].map(function(t){return'<button data-act="tab" data-v="'+t[0]+'" aria-pressed="'+(S.tab===t[0])+'">'+t[1]+'</button>'}).join("")+'</div>';
  h+=({loc:vLoc,item:vItem,move:vMove,hist:vHist})[S.tab]();
  $("main").innerHTML=h;
  if(fid){var el=$(fid);if(el)el.focus()}window.scrollTo(0,sy);
}
function gateHtml(){
  var h='<div class="gate"><div class="brand" style="margin-bottom:18px"><small>POPUP ｜ EQUIPMENT</small><b>保管備品の管理</b><span>日報サイトと同じ合言葉で入れます</span></div><div class="card">';
  if(S.gate==="loading")return h+'<h2>読み込み中です</h2></div></div>';
  if(S.gate==="noaccess")return h+'<h2>このページは使えません</h2><p class="muted" style="font-size:14px">イベント限定の合言葉では入れません。社内スタッフ用の合言葉で入ってください。</p><button class="btn" data-act="logout">合言葉を入れ直す</button></div></div>';
  return h+'<h2>合言葉を入力してください</h2>'+(S.err?'<p style="color:var(--bad);font-size:14px;margin:0 0 8px">'+esc(S.err)+'</p>':'')+'<label class="f"><span>合言葉</span><input type="password" id="code" autocomplete="current-password"></label><div style="margin-top:12px"><button class="btn primary" style="width:100%;min-height:52px" data-act="login">入る</button></div></div></div>';
}
function vLoc(){
  var it=items(),st=stock(),pl=places(),h='';
  if(!it.length)return'<div class="card"><h2>まだ品目がありません</h2><p class="muted" style="font-size:14px;margin:0">「移動・登録」で、品目と最初の置き場所を登録してください。</p><div style="margin-top:10px"><button class="btn primary" data-act="tab" data-v="move">品目を登録する</button></div></div>';
  h+='<div class="card"><h2>置き場所ごと <small>いま、どこに何があるか</small></h2><div class="loc">';
  pl.forEach(function(p){var rows=it.filter(function(x){return((st[x.id]||{})[p]||0)!==0});if(!rows.length)return;
    var sum=rows.reduce(function(a,x){return a+(st[x.id][p]||0)},0),al=p==="修理中"||p==="紛失";
    h+='<div class="lc'+(al?' alert':'')+'"><h3><span>'+esc(p)+'</span><span class="muted" style="font-size:13px">'+sum+' 点</span></h3>'+rows.map(function(x){var n=st[x.id][p];return'<div class="it"><span>'+esc(x.name)+(x.code?' <small class="muted">'+esc(x.code)+'</small>':'')+'</span><b'+(n<0?' style="color:var(--bad)"':'')+'>'+n+'</b></div>'}).join("")+'</div>'});
  h+='</div><div class="muted" style="font-size:12px;margin-top:8px">数がマイナスの場所は、移動の記録の入れ違いです。「記録」で確かめてください。</div></div>';
  return h;
}
function vItem(){
  var it=items(),st=stock(),pl=places().filter(function(p){return it.some(function(x){return((st[x.id]||{})[p]||0)!==0})}),q=S.q.trim().toLowerCase();
  var rows=it.filter(function(x){return!q||(x.name+" "+(x.code||"")+" "+(x.cat||"")+" "+(x.memo||"")).toLowerCase().indexOf(q)>=0});
  var h='<div class="card"><h2>品目ごと <small>品目 × 置き場所の一覧</small></h2><label class="f" style="margin-bottom:10px"><input type="search" id="q" value="'+esc(S.q)+'" placeholder="品目名・管理番号で絞り込み"></label>';
  if(!rows.length)return h+'<div class="muted" style="font-size:14px">該当する品目がありません。</div></div>';
  h+='<div class="tablewrap"><table><thead><tr><th>品目</th><th>合計</th>'+pl.map(function(p){return'<th>'+esc(p)+'</th>'}).join("")+'<th></th></tr></thead><tbody>';
  var last="";
  rows.forEach(function(x){if(x.cat!==last){last=x.cat;h+='<tr><td colspan="'+(pl.length+3)+'" style="background:var(--surface2);font-size:12.5px;font-weight:700;position:static">'+esc(x.cat||"未分類")+'</td></tr>'}
    var o=st[x.id]||{};h+='<tr><td><b>'+esc(x.name)+'</b>'+(x.code?'<span class="code">'+esc(x.code)+'</span>':'')+(x.memo?'<span class="code">'+esc(x.memo)+'</span>':'')+'</td><td><b>'+total(st,x.id)+'</b></td>'+pl.map(function(p){var n=o[p]||0;return'<td'+(n?'':' class="z"')+'>'+n+'</td>'}).join("")+'<td><button class="btn small" data-act="edit" data-v="'+x.id+'">変更</button></td></tr>'});
  return h+'</tbody></table></div></div>';
}
function opts(list,sel,first){return(first?'<option value="">'+esc(first)+'</option>':'')+list.map(function(p){return'<option'+(p===sel?' selected':'')+'>'+esc(p)+'</option>'}).join("")}
function vMove(){
  var it=items(),pl=places(),m=S.mv,f=S.it,st=stock();
  var h='<div class="card"><h2>移動を記録する <small>店舗へ送った・戻ってきた・修理に出した など</small></h2>';
  if(!it.length)h+='<div class="muted" style="font-size:14px">先に下で品目を登録してください。</div>';
  else{
    var cur=m.item?(st[m.item]||{}):{},have=Object.keys(cur).filter(function(p){return cur[p]>0});
    h+='<div class="grid g2"><label class="f"><span>品目</span><select id="mv_item">'+'<option value="">選んでください</option>'+it.map(function(x){return'<option value="'+x.id+'"'+(x.id===m.item?' selected':'')+'>'+esc(x.name+(x.code?"（"+x.code+"）":""))+'</option>'}).join("")+'</select></label>'+
     '<label class="f"><span>数</span><input type="number" inputmode="numeric" min="1" id="mv_n" value="'+esc(m.n||1)+'"></label>'+
     '<label class="f"><span>どこから</span><select id="mv_from">'+opts(have.length?have:pl,m.from,null)+'<option value="'+NEW+'"'+(m.from===NEW?' selected':'')+'>'+NEW+'</option></select></label>'+
     '<label class="f"><span>どこへ</span><input type="text" id="mv_to" list="pl" value="'+esc(m.to||"")+'" placeholder="例：京都高島屋S.C. T8／本部倉庫／修理中"><datalist id="pl">'+pl.map(function(p){return'<option value="'+esc(p)+'">'}).join("")+'<option value="'+OUT+'"></datalist></label>'+
     '<label class="f"><span>日付</span><input type="date" id="mv_date" value="'+esc(m.date||today())+'"></label>'+
     '<label class="f"><span>メモ（任意）</span><input type="text" id="mv_memo" value="'+esc(m.memo||"")+'" placeholder="例：宅配で発送、11/1着"></label></div>'+
     (m.item?'<div class="muted" style="font-size:12.5px;margin-top:8px">いまの置き場所：'+(have.length?have.map(function(p){return esc(p)+' '+cur[p]}).join("／"):'なし')+'</div>':'')+
     '<div class="row" style="margin-top:12px"><button class="btn primary" data-act="mvsave">この移動を記録する</button></div>';
  }
  h+='</div>';
  h+='<div class="card"><h2>'+(f.id?'品目を変更する':'品目を登録する')+' <small>レジ・ドロアー・什器など</small></h2><div class="grid g2">'+
   '<label class="f"><span>品目名</span><input type="text" id="it_name" value="'+esc(f.name||"")+'" placeholder="例：キャッシュドロアー"></label>'+
   '<label class="f"><span>区分</span><select id="it_cat">'+opts(CATS,f.cat||CATS[0])+'</select></label>'+
   '<label class="f"><span>管理番号（任意）</span><input type="text" id="it_code" value="'+esc(f.code||"")+'" placeholder="例：DR-01"></label>'+
   '<label class="f"><span>メモ（任意）</span><input type="text" id="it_memo" value="'+esc(f.memo||"")+'" placeholder="例：鍵は2本、ケースに入れて保管"></label>'+
   (f.id?'':'<label class="f"><span>最初の数</span><input type="number" inputmode="numeric" min="0" id="it_n" value="1"></label><label class="f"><span>最初の置き場所</span><input type="text" id="it_place" list="pl2" value="本部倉庫"><datalist id="pl2">'+places().map(function(p){return'<option value="'+esc(p)+'">'}).join("")+'</datalist></label>')+
   '</div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="itsave">'+(f.id?'この内容で変更':'登録する')+'</button>'+(f.id?'<button class="btn" data-act="itnew">やめる</button><button class="btn danger" data-act="itdel" data-v="'+f.id+'">'+(S.confirm==="del:"+f.id?'もう一度押すと削除':'この品目を削除')+'</button>':'')+'</div>'+
   (f.id?'<div class="muted" style="font-size:12px;margin-top:6px">数や置き場所を変えるときは、上の「移動を記録する」を使います。</div>':'')+'</div>';
  return h;
}
function vHist(){
  var it={},mv=moves().slice().reverse();items().forEach(function(x){it[x.id]=x});
  var h='<div class="card hist"><h2>記録 <small>新しい順・'+mv.length+' 件</small></h2>';
  if(!mv.length)return h+'<div class="muted" style="font-size:14px">まだ記録がありません。</div></div>';
  mv.slice(0,200).forEach(function(m){var x=it[m.item]||{name:"（削除した品目）"};
    h+='<div class="h"><b>'+md(m.date)+'</b><div class="t">'+esc(x.name)+' ×'+esc(m.n)+'　'+esc(m.from||"新しく入れた")+' → '+esc(m.to||"廃棄・処分")+'<small>'+esc(m.by||"")+(m.memo?'・'+esc(m.memo):'')+'</small></div><button class="btn small danger" data-act="mvdel" data-v="'+m.id+'">'+(S.confirm==="mv:"+m.id?'もう一度押すと取消':'取消')+'</button></div>'});
  return h+'</div>';
}
function val(id){var e=$(id);return e?String(e.value).trim():""}
function act(a,v){
  render.force=true;
  if(a==="login")return login();
  if(a==="logout"){try{localStorage.removeItem("t8code")}catch(e){}S.gate="login";return render()}
  if(a==="tab"){S.tab=v;S.confirm=null;return render()}
  if(a==="edit"){var x=docs()[v];if(!x)return;S.it=Object.assign({id:v},x);S.tab="move";render();window.scrollTo(0,document.body.scrollHeight);return}
  if(a==="itnew"){S.it={};S.confirm=null;return render()}
  if(a==="itsave"){
    var name=val("it_name");if(!name)return toast("品目名を入れてください",1);
    var f=S.it,d={name:name,cat:val("it_cat"),code:val("it_code"),memo:val("it_memo"),at:(f.at||Date.now()),by:S.who};
    if(f.id){put(f.id,d).then(function(){toast("品目を変更しました");S.it={};render.force=true;render()},err);return}
    var n=Math.max(0,Math.round(+val("it_n")||0)),pl=val("it_place")||"本部倉庫",id="i-"+rid();
    put(id,d).then(function(){return n?put("m-"+rid(),{item:id,n:n,from:"",to:pl,date:today(),by:S.who,memo:"登録",at:Date.now()}):null}).then(function(){toast("品目を登録しました");S.it={};S.mv={item:id};render.force=true;render()},err);return;
  }
  if(a==="itdel"){if(S.confirm!=="del:"+v){S.confirm="del:"+v;return render()}S.confirm=null;
    var ops=[put(v,null)];moves().filter(function(m){return m.item===v}).forEach(function(m){ops.push(put(m.id,null))});
    Promise.all(ops).then(function(){toast("品目を削除しました");S.it={};render.force=true;render()},err);return}
  if(a==="mvsave"){
    var m={item:val("mv_item"),n:Math.round(+val("mv_n")||0),from:val("mv_from"),to:val("mv_to"),date:val("mv_date")||today(),memo:val("mv_memo")};
    if(!m.item)return toast("品目を選んでください",1);if(m.n<=0)return toast("数を入れてください",1);if(!m.to)return toast("どこへ移すかを入れてください",1);
    if(m.from===NEW)m.from="";if(m.to===OUT)m.to="";if(m.from&&m.from===m.to)return toast("移動元と移動先が同じです",1);
    var have=(stock()[m.item]||{})[m.from]||0;
    if(m.from&&have<m.n&&S.confirm!=="over"){S.confirm="over";S.mv=m;render();return toast(m.from+" には "+have+" 点しかありません。そのまま記録するなら、もう一度押してください",1)}
    S.confirm=null;
    put("m-"+rid(),Object.assign({},m,{by:S.who,at:Date.now()})).then(function(){toast("移動を記録しました");S.mv={item:m.item};render.force=true;render()},err);return;
  }
  if(a==="mvdel"){if(S.confirm!=="mv:"+v){S.confirm="mv:"+v;return render()}S.confirm=null;put(v,null).then(function(){toast("取り消しました");render.force=true;render()},err);return}
}
function err(e){console.error(e);toast("保存できませんでした："+(e&&e.message||"通信を確認してください"),1)}
document.addEventListener("click",function(e){var el=e.target.closest&&e.target.closest("[data-act]");if(!el)return;e.preventDefault();act(el.dataset.act,el.dataset.v)});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target&&e.target.id==="code")login()});
document.addEventListener("input",function(e){var t=e.target;if(t.id==="q"){S.q=t.value;render.force=true;render()}if(t.id==="who"){S.who=t.value;try{localStorage.setItem("t8who",t.value)}catch(x){}}});
document.addEventListener("change",function(e){var t=e.target;if(t.id==="mv_item"){S.mv={item:t.value,n:val("mv_n"),to:val("mv_to"),date:val("mv_date"),memo:val("mv_memo")};render.force=true;render()}});
document.addEventListener("focusout",function(){setTimeout(function(){if(S.pending){var a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))render()}},60)});
async function login(code){
  var A=window.T8Data,c=code||val("code");if(!c)return;
  if(!A||!A.configured()){S.err="設定（config.js）がありません";S.gate="login";return render()}
  A.setCode(c);S.gate="loading";render();
  try{await A.connect();try{localStorage.setItem("t8code",c)}catch(x){}
    if(A.scope().role==="event"){S.gate="noaccess";return render()}
    S.gate=null;A.db.collection("eq").onSnapshot(function(){render()});A.db.collection("config").onSnapshot(function(){render()});render.force=true;render();
  }catch(e){S.gate="login";S.err=e&&e.code==="unauthorized"?"合言葉が違います。":"データを読み込めませんでした。通信を確認してください。";render.force=true;render()}
}
var saved="";try{saved=localStorage.getItem("t8code")||""}catch(e){}
if(saved)login(saved);else render();
})();
</script>
